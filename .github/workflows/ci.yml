name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun run lint
      # app typecheck (root tsconfig excludes mini-services/scripts)
      - run: bunx tsc --noEmit
      # realtime worker typecheck (self-contained tsconfig)
      - run: bunx tsc --noEmit -p mini-services/realtime-worker/tsconfig.json
